name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend
        working-directory: server
        run: npm install

      - name: Seed database (skip)
        run: echo "Skipping MongoDB seed in CI"

      - name: Install frontend
        working-directory: client
        run: npm install

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Verify submission artifacts
        run: |
          python -c "import docx" 2>/dev/null || true
          python verify_submission.py

  # NOTE:
  # Render + Vercel auto-deploy are recommended.
  # This workflow only ensures the repo builds and required artifacts exist.

